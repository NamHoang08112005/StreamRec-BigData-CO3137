services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recsys
      POSTGRES_PASSWORD: recsys
      POSTGRES_DB: recsys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recsys -d recsys"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-init:
    image: bitnamilegacy/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events.user --partitions 3 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events.content --partitions 3 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events.extract --partitions 3 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic features.user --partitions 3 --replication-factor 1;
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic features.item --partitions 3 --replication-factor 1;
      echo topics-ready;
      "

  spark-master:
    image: bitnamilegacy/spark:3.5
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./jobs/spark:/opt/jobs:ro

  spark-worker:
    image: bitnamilegacy/spark:3.5
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./jobs/spark:/opt/jobs:ro

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://recsys:recsys@postgres:5432/recsys
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      MEDIA_ROOT: /data/media
      MEDIA_PUBLIC_BASE: http://localhost:8000/media
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      BATCH_CF_INTERVAL_SEC: "90"
      AUTO_UPLOAD_INTERVAL_SEC: "15"
      AUTO_UPLOAD_KEEP: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - media_data:/data/media
      - ./data/seed:/data/seed:ro

  upload-simulator:
    build:
      context: ./apps/upload-simulator
    environment:
      API_BASE: http://api:8000
      POOL_DIR: /data/coldstart/upload_pool
      POOL_META: /data/coldstart/pool_meta.json
      UPLOAD_INTERVAL_SEC: "15"
      UPLOAD_BATCH_SIZE: "5"
      CREATOR_ID: creator_auto
    volumes:
      - ./data/coldstart/upload_pool:/data/coldstart/upload_pool:ro
      - ./data/coldstart/pool_meta.json:/data/coldstart/pool_meta.json:ro
    depends_on:
      api:
        condition: service_started

  extract-worker:
    build:
      context: ./apps/extract-worker
    environment:
      DATABASE_URL: postgresql+psycopg://recsys:recsys@postgres:5432/recsys
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      MEDIA_ROOT: /data/media
    depends_on:
      api:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - media_data:/data/media

  speed-worker:
    build:
      context: ./apps/speed-worker
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      WINDOW_SEC: "60"
      FLUSH_INTERVAL_SEC: "3"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  traffic-simulator:
    build:
      context: ./apps/traffic-simulator
    environment:
      API_BASE: http://api:8000
      EVENTS_PER_SEC: "200"
      SPEEDUP: "3600"
      MAX_GAP_SLEEP: "0.05"
      CONCURRENCY: "12"
      STREAM_CSV: /data/raw/shortvideo/interactions_stream.csv
      VIDEO_MAP: /data/raw/shortvideo/video_id_map.json
      LOOP_STREAM: "1"
    volumes:
      - ./data/raw/shortvideo:/data/raw/shortvideo:ro
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

  spark-speed:
    image: bitnamilegacy/spark:3.5
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      spark-master:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./jobs/spark:/opt/jobs:ro
    entrypoint: >
      /bin/bash -c "
      pip install redis==5.0.8 &&
      spark-submit --master local[2]
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
        /opt/jobs/speed_stream.py
      "
    profiles:
      - spark-jobs

  spark-batch-scheduler:
    image: bitnamilegacy/spark:3.5
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    environment:
      HOME: /root
      HADOOP_USER_NAME: spark
      SPARK_USER: spark
      DATABASE_URL: jdbc:postgresql://postgres:5432/recsys
      PG_USER: recsys
      PG_PASSWORD: recsys
      REDIS_URL: redis://redis:6379/0
      SPARK_BATCH_INTERVAL_SEC: "180"
    volumes:
      - ./jobs/spark:/opt/jobs:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /tmp/.ivy2 /tmp/.pip
        pip install --target=/tmp/.pip --no-cache-dir redis==5.0.8 numpy >/dev/null 2>&1 || true
        export PYTHONPATH=/tmp/.pip
        sleep 3
        while true; do
          spark-submit --master spark://spark-master:7077 --driver-memory 512m --executor-memory 1g --total-executor-cores 2 --conf spark.jars.ivy=/tmp/.ivy2 --conf spark.driver.extraJavaOptions=-Duser.home=/tmp --packages org.postgresql:postgresql:42.7.3 /opt/jobs/batch_cf.py || true
          sleep 180
        done

  spark-batch:
    image: bitnamilegacy/spark:3.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/recsys
      PG_USER: recsys
      PG_PASSWORD: recsys
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./jobs/spark:/opt/jobs:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir redis==5.0.8 >/dev/null 2>&1 || true
        spark-submit --master spark://spark-master:7077 --driver-memory 512m --executor-memory 1g --total-executor-cores 2 --packages org.postgresql:postgresql:42.7.3 /opt/jobs/batch_cf.py
    profiles:
      - spark-jobs

volumes:
  postgres_data:
  kafka_data:
  media_data:
